<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Business Strategy Simulation Platform</title>
  <meta name="description" content="Standalone Academic Business Strategy Simulation Platform for MBA students and faculty.">
  <style>
/* ==========================================================================
   Academic Business Strategy Simulation Platform
   Design System: Minimalist Academic Dark Blue & White
   ========================================================================== */

:root {
  /* Color Palette - Strict Dark Blue & Crisp White */
  --color-primary-navy: #0f2942;       /* Primary dark blue */
  --color-primary-dark: #0a1c2e;       /* Deepest navy for text/headers */
  --color-primary-hover: #163a5d;      /* Hover state for buttons/tabs */
  --color-primary-light: #f0f5fa;      /* Very soft blue tint for subtle backgrounds */
  --color-primary-border: #cbd7e3;     /* Subtle blue-gray border */
  
  --color-white: #ffffff;
  --color-bg-body: #f8fafc;
  --color-border-subtle: #e2e8f0;
  --color-border-medium: #cbd5e1;
  --color-text-main: #0a1c2e;
  --color-text-muted: #475569;
  --color-text-light: #64748b;

  /* Status Tokens (Academic, Desaturated) */
  --badge-inprogress-bg: #f1f5f9;
  --badge-inprogress-text: #0f2942;
  --badge-inprogress-border: #cbd5e1;

  --badge-submitted-bg: #e6f0fa;
  --badge-submitted-text: #0f2942;
  --badge-submitted-border: #93c5fd;

  --badge-evaluated-bg: #0f2942;
  --badge-evaluated-text: #ffffff;
  --badge-evaluated-border: #0f2942;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Spacing */
  --space-xxs: 4px;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-xxl: 48px;

  /* Layout */
  --header-height: 64px;
  --max-content-width: 1360px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-full: 9999px;
}

/* Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background-color: var(--color-white);
  color: var(--color-text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* App Layout */
#app-root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.main-container {
  flex: 1;
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
}

.student-landing-view,
.professor-dashboard-view,
.professor-report-view {
  width: 100%;
  max-width: var(--max-content-width);
  margin: 0 auto;
  padding: var(--space-lg) var(--space-xl);
}

/* Header */
.app-header {
  height: var(--header-height);
  background-color: var(--color-white);
  border-bottom: 1px solid var(--color-border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-xl);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.brand-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--color-primary-navy);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  cursor: pointer;
  text-decoration: none;
}

.brand-badge {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background-color: var(--color-primary-navy);
  color: var(--color-white);
  padding: 2px 7px;
  border-radius: var(--radius-sm);
}

.header-center {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
}

.period-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background-color: var(--color-primary-light);
  border: 1px solid var(--color-primary-border);
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-primary-navy);
}

.period-pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--color-primary-navy);
}

.header-right {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  position: relative;
}

.current-role-badge {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--color-text-muted);
  background: var(--color-primary-light);
  border: 1px solid var(--color-border-subtle);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
}

/* Circular Profile Avatar Control */
.profile-avatar-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-color: var(--color-primary-navy);
  color: var(--color-white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  border: 2px solid var(--color-primary-navy);
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.1s ease;
  user-select: none;
}

.profile-avatar-btn:hover {
  background-color: var(--color-primary-hover);
}

.profile-avatar-btn:focus-visible {
  outline: 2px solid var(--color-primary-navy);
  outline-offset: 2px;
}

/* Profile Dropdown Menu */
.profile-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 240px;
  background: var(--color-white);
  border: 1px solid var(--color-border-medium);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 16px rgba(15, 41, 66, 0.08);
  padding: var(--space-xs) 0;
  display: none;
  z-index: 110;
}

.profile-dropdown.open {
  display: block;
}

.dropdown-header {
  padding: var(--space-xs) var(--space-md);
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--color-text-light);
  border-bottom: 1px solid var(--color-border-subtle);
  margin-bottom: var(--space-xs);
}

.dropdown-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: var(--space-xs) var(--space-md);
  border: none;
  background: transparent;
  text-align: left;
  font-size: 0.9rem;
  color: var(--color-text-main);
  cursor: pointer;
}

.dropdown-item:hover {
  background-color: var(--color-primary-light);
  color: var(--color-primary-navy);
}

.dropdown-item.active {
  font-weight: 700;
  color: var(--color-primary-navy);
  background-color: var(--color-primary-light);
}

.dropdown-item .check {
  font-weight: 900;
  color: var(--color-primary-navy);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  padding: 8px 16px;
  font-size: 0.88rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  text-decoration: none;
  font-family: inherit;
  line-height: 1.25;
}

.btn-primary {
  background-color: var(--color-primary-navy);
  color: var(--color-white);
  border-color: var(--color-primary-navy);
}

.btn-primary:hover {
  background-color: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
}

.btn-outline {
  background-color: var(--color-white);
  color: var(--color-primary-navy);
  border-color: var(--color-primary-navy);
}

.btn-outline:hover {
  background-color: var(--color-primary-light);
}

.btn-ghost {
  background-color: transparent;
  color: var(--color-text-muted);
  border-color: transparent;
}

.btn-ghost:hover {
  background-color: var(--color-border-subtle);
  color: var(--color-primary-navy);
}

.btn-sm {
  padding: 5px 10px;
  font-size: 0.8rem;
}

.btn-lg {
  padding: 12px 24px;
  font-size: 1rem;
}

/* Typography Helpers */
.page-title {
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--color-primary-dark);
  margin-bottom: var(--space-xxs);
}

.page-subtitle {
  font-size: 0.95rem;
  color: var(--color-text-muted);
  margin-bottom: var(--space-lg);
}

.section-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--color-primary-navy);
  margin-bottom: var(--space-sm);
}

/* Cards */
.card {
  background-color: var(--color-white);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  margin-bottom: var(--space-lg);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
  padding-bottom: var(--space-xs);
  border-bottom: 1px solid var(--color-border-subtle);
}

/* Status Badges */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.status-badge.in-progress {
  background-color: var(--badge-inprogress-bg);
  color: var(--badge-inprogress-text);
  border: 1px solid var(--badge-inprogress-border);
}

.status-badge.submitted {
  background-color: var(--badge-submitted-bg);
  color: var(--badge-submitted-text);
  border: 1px solid var(--badge-submitted-border);
}

.status-badge.evaluated {
  background-color: var(--badge-evaluated-bg);
  color: var(--badge-evaluated-text);
  border: 1px solid var(--badge-evaluated-border);
}

.status-badge.awaiting-submission {
  background-color: #fafafa;
  color: #888888;
  border: 1px dashed var(--color-border-medium);
}

/* Tables */
.table-responsive {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
}

.academic-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.9rem;
  background-color: var(--color-white);
}

.academic-table th {
  background-color: var(--color-primary-light);
  color: var(--color-primary-navy);
  font-weight: 700;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border-medium);
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.academic-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--color-border-subtle);
  vertical-align: middle;
}

.academic-table tbody tr:last-child td {
  border-bottom: none;
}

.academic-table tbody tr:hover {
  background-color: #fbfcfe;
}

/* Form Controls */
.form-group {
  margin-bottom: var(--space-md);
}

.form-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-primary-navy);
  margin-bottom: 6px;
}

.form-control, .form-select, textarea.form-control {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--color-border-medium);
  border-radius: var(--radius-sm);
  background-color: var(--color-white);
  color: var(--color-text-main);
  font-family: inherit;
  font-size: 0.9rem;
  transition: border-color 0.15s ease;
}

.form-control:focus, .form-select:focus, textarea.form-control:focus {
  outline: none;
  border-color: var(--color-primary-navy);
}

/* Inline Editable Select */
.inline-select {
  font-size: 0.86rem;
  font-weight: 500;
  padding: 6px 10px;
  border: 1px solid var(--color-border-medium);
  border-radius: var(--radius-sm);
  background-color: var(--color-white);
  color: var(--color-primary-navy);
  cursor: pointer;
  max-width: 280px;
}

.inline-select:focus {
  outline: 2px solid var(--color-primary-navy);
}

/* Metric / Stat Strip */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
}

.stat-card {
  background: var(--color-white);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-md);
}

.stat-label {
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--color-text-light);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--color-primary-navy);
}

.stat-caption {
  font-size: 0.75rem;
  color: var(--color-text-muted);
  margin-top: 2px;
}

/* ==========================================================================
   Professor Views
   ========================================================================== */

/* Report Header Summary */
.report-header-card {
  background: var(--color-primary-light);
  border: 1px solid var(--color-primary-border);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  margin-bottom: var(--space-xl);
}

.report-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}

.report-meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--space-md);
  background: var(--color-white);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
}

.report-meta-item .label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--color-text-light);
}

.report-meta-item .val {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--color-primary-navy);
  margin-top: 2px;
}

/* Accordion Quarterly Cards */
.accordion-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.accordion-item {
  background: var(--color-white);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: border-color 0.15s ease;
}

.accordion-item.open {
  border-color: var(--color-primary-navy);
}

.accordion-header {
  padding: var(--space-md) var(--space-lg);
  background: var(--color-white);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  border-bottom: 1px solid transparent;
}

.accordion-item.open .accordion-header {
  border-bottom-color: var(--color-border-subtle);
  background-color: var(--color-primary-light);
}

.accordion-title-left {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.q-code-pill {
  font-size: 0.85rem;
  font-weight: 700;
  padding: 3px 8px;
  background: var(--color-primary-navy);
  color: var(--color-white);
  border-radius: var(--radius-sm);
}

.q-title-text {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--color-primary-dark);
}

.q-dates-text {
  font-size: 0.82rem;
  color: var(--color-text-muted);
}

.accordion-title-right {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.q-score-badge {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--color-primary-navy);
  padding: 3px 10px;
  background: var(--color-white);
  border: 1px solid var(--color-border-medium);
  border-radius: var(--radius-sm);
}

.accordion-chevron {
  width: 18px;
  height: 18px;
  transition: transform 0.2s ease;
  color: var(--color-primary-navy);
}

.accordion-item.open .accordion-chevron {
  transform: rotate(180deg);
}

.accordion-body {
  padding: var(--space-lg);
  display: none;
  background: var(--color-white);
}

.accordion-item.open .accordion-body {
  display: block;
}

.q-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--space-lg);
  margin-bottom: var(--space-lg);
}

.q-box {
  background: #fbfcfe;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
}

.q-box-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--color-text-light);
  letter-spacing: 0.04em;
  margin-bottom: var(--space-xs);
}

.q-box-content {
  font-size: 0.9rem;
  color: var(--color-text-main);
  line-height: 1.5;
}

.q-eval-section {
  border-top: 1px solid var(--color-border-subtle);
  padding-top: var(--space-md);
  margin-top: var(--space-md);
}

/* ==========================================================================
   Student Landing View
   ========================================================================== */

.student-hero {
  background: var(--color-primary-light);
  border: 1px solid var(--color-primary-border);
  border-radius: var(--radius-md);
  padding: var(--space-xl);
  margin-bottom: var(--space-xl);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-lg);
}

.hero-info .team-subhead {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--color-text-muted);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

.hero-info .industry-head {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--color-primary-navy);
  margin-bottom: 6px;
}

.hero-info .quarter-callout {
  font-size: 0.92rem;
  color: var(--color-text-muted);
}

/* Industry Framework Tabs / Sections */
.overview-tabs {
  display: flex;
  border-bottom: 1px solid var(--color-border-medium);
  margin-bottom: var(--space-lg);
  overflow-x: auto;
  gap: var(--space-xs);
}

.overview-tab-btn {
  padding: 10px 16px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--color-text-muted);
  cursor: pointer;
  white-space: nowrap;
}

.overview-tab-btn:hover {
  color: var(--color-primary-navy);
}

.overview-tab-btn.active {
  color: var(--color-primary-navy);
  border-bottom-color: var(--color-primary-navy);
  background: var(--color-primary-light);
}

.tab-pane {
  display: none;
}

.tab-pane.active {
  display: block;
}

/* ==========================================================================
   Student Chat Workspace
   ========================================================================== */

.chat-workspace-container {
  display: flex;
  flex-direction: column;
  height: calc(100vh - var(--header-height));
  background: var(--color-white);
  border: none;
  border-radius: 0;
  overflow: hidden;
  width: 100%;
}

.chat-header-bar {
  background: var(--color-primary-light);
  border-bottom: 1px solid var(--color-border-medium);
  padding: 16px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.chat-header-left {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.chat-title-group h2 {
  font-size: clamp(1.18rem, 1.35vw, 1.35rem);
  font-weight: 800;
  color: var(--color-primary-navy);
  line-height: 1.25;
}

.chat-title-group .sub {
  font-size: 0.92rem;
  color: var(--color-text-muted);
  margin-top: 4px;
}

.chat-header-right {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

/* Chat Main Layout with Collapsible Snapshot Panel */
.chat-workspace-body {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

.chat-conversation-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.messages-scrollable {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  background-color: var(--color-white);
}

/* Message Bubbles */
.chat-message {
  display: flex;
  flex-direction: column;
  animation: fadeIn 0.15s ease-out;
}

.chat-message.student {
  align-self: flex-end;
  align-items: flex-end;
  max-width: min(920px, 86%);
}

.chat-message.ai {
  align-self: flex-start;
  align-items: flex-start;
  max-width: min(1200px, 94%);
  width: 100%;
}

.chat-message.system {
  align-self: center;
  max-width: 90%;
  text-align: center;
}

.message-meta {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--color-text-light);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.message-bubble {
  padding: 28px 36px;
  border-radius: var(--radius-lg);
  font-size: clamp(1.08rem, 1.25vw, 1.22rem);
  line-height: 1.82;
  word-break: break-word;
}

.chat-message.student .message-bubble {
  background-color: var(--color-primary-navy);
  color: #ffffff !important;
  border-bottom-right-radius: 2px;
  font-size: clamp(1.05rem, 1.18vw, 1.16rem);
  padding: 18px 26px;
  box-shadow: 0 2px 8px rgba(15, 41, 66, 0.15);
}

.chat-message.student .message-bubble,
.chat-message.student .message-bubble .chat-p,
.chat-message.student .message-bubble strong,
.chat-message.student .message-bubble em,
.chat-message.student .message-bubble li,
.chat-message.student .message-bubble span {
  color: #ffffff !important;
}

.chat-message.ai .message-bubble {
  background-color: #ffffff;
  color: #0a1c2e;
  border: 1px solid #cbd5e1;
  border-bottom-left-radius: 2px;
  box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
  width: 100%;
}

.chat-message.system .message-bubble {
  background-color: #f1f5f9;
  color: var(--color-primary-navy);
  border: 1px dashed var(--color-border-medium);
  font-size: 0.95rem;
  font-weight: 500;
  padding: 16px 24px;
}

/* Chat text typography - clean, readable, single cohesive color tone */
.chat-heading-hero {
  font-size: clamp(1.28rem, 1.48vw, 1.55rem);
  font-weight: 800;
  color: var(--color-primary-navy);
  margin-bottom: 22px;
  padding-bottom: 12px;
  border-bottom: 2px solid #e2e8f0;
  line-height: 1.35;
  letter-spacing: -0.01em;
}

.chat-param-row {
  font-size: clamp(1.06rem, 1.2vw, 1.16rem);
  line-height: 1.75;
  margin-bottom: 12px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  color: #1e293b;
}

.chat-section-label {
  font-size: clamp(1.18rem, 1.32vw, 1.34rem);
  font-weight: 800;
  color: var(--color-primary-navy);
  margin-top: 22px;
  margin-bottom: 10px;
  display: block;
  line-height: 1.4;
}

.chat-divider-rule {
  height: 1px;
  background-color: #e2e8f0;
  margin: 20px 0;
  border: none;
}

.chat-p {
  font-size: clamp(1.08rem, 1.25vw, 1.22rem);
  margin: 0 0 16px 0;
  line-height: 1.82;
  color: inherit;
}

.chat-p:last-child {
  margin-bottom: 0;
}

.chat-spacer {
  height: 16px;
}

.chat-bubble-list {
  margin: 12px 0 20px 0;
  padding-left: 28px;
  list-style-type: disc;
}

.chat-bubble-list li {
  font-size: clamp(1.06rem, 1.22vw, 1.2rem);
  margin-bottom: 10px;
  line-height: 1.8;
  color: inherit;
}

.chat-bubble-list li:last-child {
  margin-bottom: 0;
}

.message-bubble strong {
  font-weight: 700;
  color: inherit;
}

.message-bubble em {
  font-style: italic;
  color: inherit;
}

/* Chat Input Bar Fixed at Bottom */
.chat-input-bar {
  border-top: 1px solid var(--color-border-subtle);
  background: var(--color-white);
  padding: 18px 48px 22px 48px;
  flex-shrink: 0;
}

.quick-prompts-bar {
  display: flex;
  gap: var(--space-xs);
  margin-bottom: var(--space-xs);
  overflow-x: auto;
  padding-bottom: 4px;
}

.prompt-chip {
  font-size: 0.82rem;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: var(--radius-full);
  background-color: var(--color-primary-light);
  border: 1px solid var(--color-primary-border);
  color: var(--color-primary-navy);
  cursor: pointer;
  white-space: nowrap;
}

.prompt-chip:hover {
  background-color: var(--color-primary-navy);
  color: var(--color-white);
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: var(--space-md);
  background: var(--color-white);
  border: 1.5px solid var(--color-border-medium);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.input-row:focus-within {
  border-color: var(--color-primary-navy);
  box-shadow: 0 0 0 3px rgba(15, 41, 66, 0.08);
}

.chat-textarea {
  flex: 1;
  border: none;
  background: transparent;
  resize: none;
  font-family: inherit;
  font-size: clamp(1.05rem, 1.15vw, 1.15rem);
  line-height: 1.55;
  min-height: 48px;
  max-height: 180px;
  outline: none;
  color: var(--color-text-main);
}

.chat-textarea::placeholder {
  font-size: clamp(1rem, 1.1vw, 1.1rem);
  color: #94a3b8;
}

.input-hint {
  font-size: 0.88rem;
  color: var(--color-text-light);
  margin-top: 8px;
  line-height: 1.45;
}

/* ==========================================================================
   Full-Width Chat Layout & Inline Horizontal Evaluation Dossier
   ========================================================================== */

/* Full-width container and workspace */
.chat-workspace-body.full-width {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
  width: 100%;
}

.chat-conversation-area.full-width {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.messages-scrollable.full-width {
  flex: 1;
  width: 100%;
  box-sizing: border-box;
  padding: 32px 48px 48px 48px;
}

/* Quarter Navigation Ribbon */
.quarter-nav-ribbon {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #f8fafc;
  border-bottom: 1px solid var(--color-border-subtle);
  padding: 12px 48px;
  overflow-x: auto;
  flex-shrink: 0;
}

.ribbon-label {
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--color-primary-navy);
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.ribbon-pills {
  display: flex;
  gap: 10px;
  align-items: center;
}

.quarter-nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border-medium);
  background: var(--color-white);
  color: var(--color-text-main);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.quarter-nav-pill:hover:not(:disabled) {
  border-color: var(--color-primary-navy);
  color: var(--color-primary-navy);
  background: var(--color-primary-light);
}

.quarter-nav-pill.active {
  background: var(--color-primary-navy);
  color: var(--color-white);
  border-color: var(--color-primary-navy);
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(15, 41, 66, 0.2);
}

.quarter-nav-pill.completed {
  background: #f0fdf4;
  color: #166534;
  border-color: #bbf7d0;
  font-weight: 700;
}

.quarter-nav-pill.locked {
  opacity: 0.45;
  cursor: not-allowed;
  background: #f1f5f9;
}

.quarter-nav-pill .pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #eab308;
  display: inline-block;
  animation: pulse 1.5s infinite;
}

.quarter-nav-pill .check {
  font-size: 0.75rem;
  font-weight: 800;
}

/* Quarter Chat Section and Dividers */
.quarter-chat-section {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  margin-bottom: 24px;
  width: 100%;
}

.quarter-chat-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 22px 0 16px 0;
  width: 100%;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: #cbd5e1;
}

.divider-badge {
  font-size: 0.95rem;
  font-weight: 700;
  background: #f1f5f9;
  color: var(--color-primary-navy);
  padding: 8px 24px;
  border-radius: var(--radius-full);
  border: 1px solid #cbd5e1;
  letter-spacing: 0.02em;
}

.quarter-messages-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  width: 100%;
}

/* Typing bubble custom text */
.typing-bubble {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 16px 24px;
  color: var(--color-primary-navy);
  font-weight: 600;
  font-size: 1.05rem;
}

.typing-text {
  margin-left: 8px;
  font-weight: 500;
  font-size: 0.96rem;
  color: var(--color-text-muted);
}

/* ==========================================================================
   Comprehensive Inline Horizontal Evaluation Dossier Card
   ========================================================================== */

.chat-evaluation-dossier {
  width: 100%;
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: var(--radius-md);
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.07);
  overflow: hidden;
  margin: 20px 0 32px 0;
  animation: fadeIn 0.25s ease-out;
}

/* 1. Dossier Header */
.dossier-header-bar {
  background: var(--color-primary-navy);
  color: #ffffff;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.dossier-header-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.dossier-header-icon {
  font-size: 1.6rem;
  line-height: 1;
}

.dossier-header-title h3 {
  font-size: 1.15rem;
  font-weight: 800;
  color: #ffffff;
  margin: 0;
  line-height: 1.3;
}

.dossier-header-sub {
  font-size: 0.8rem;
  color: #cbd5e1;
  margin-top: 2px;
}

.dossier-score-pills {
  display: flex;
  gap: 12px;
}

.score-pill-card {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  text-align: center;
  min-width: 100px;
}

.score-pill-card.rank {
  background: #1e3a5f;
  border-color: #60a5fa;
}

.score-pill-card.depth {
  background: #0f2942;
  border-color: #f59e0b;
}

.score-pill-label {
  display: block;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #e2e8f0;
  font-weight: 700;
}

.score-pill-val {
  display: block;
  font-size: 1.25rem;
  font-weight: 800;
  color: #ffffff;
}

.score-pill-val small {
  font-size: 0.72rem;
  font-weight: 500;
  color: #cbd5e1;
}

/* Dossier Body */
.dossier-body {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  background: #ffffff;
}

/* Strategic Depth Formulation & Improvement Card */
.dossier-depth-card {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
}

.depth-card-header {
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.depth-card-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.depth-card-icon {
  font-size: 1.4rem;
  line-height: 1;
}

.depth-card-title {
  font-size: 1.12rem;
  font-weight: 700;
  color: var(--color-primary-navy);
}

.depth-card-sub {
  font-size: 0.85rem;
  color: var(--color-text-muted);
  margin-top: 2px;
}

.depth-level-pill {
  font-size: 0.82rem;
  font-weight: 700;
  padding: 5px 14px;
  border-radius: var(--radius-full);
}

.depth-level-pill.low {
  background: #fef2f2;
  color: #991b1b;
  border: 1px solid #fecaca;
}

.depth-level-pill.medium {
  background: #fefce8;
  color: #854d0e;
  border: 1px solid #fef08a;
}

.depth-level-pill.high {
  background: #f0fdf4;
  color: #166534;
  border: 1px solid #bbf7d0;
}

.depth-card-body {
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.depth-impact-banner {
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.98rem;
  line-height: 1.6;
}

.depth-impact-banner.penalty {
  background: #fff1f2;
  color: #9f1239;
  border: 1px solid #fecdd3;
}

.depth-impact-banner.neutral {
  background: #f8fafc;
  color: #334155;
  border: 1px solid #e2e8f0;
}

.depth-impact-banner.bonus {
  background: #f0fdf4;
  color: #166534;
  border: 1px solid #bbf7d0;
}

.depth-analysis-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
}

.depth-analysis-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: var(--radius-sm);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.depth-analysis-box.improvement {
  border-left: 3px solid var(--color-primary-navy);
}

.depth-box-title {
  font-size: 0.88rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--color-primary-navy);
  letter-spacing: 0.03em;
}

.depth-box-content {
  font-size: 0.96rem;
  line-height: 1.65;
  color: var(--color-text-main);
}

/* 2. 3-Column Report Grid (Strengths, Weaknesses, Recommendations) */
.dossier-report-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
}

.dossier-report-card {
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
}

.dossier-report-card.strengths {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-left: 4px solid #16a34a;
}

.dossier-report-card.weaknesses {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-left: 4px solid #dc2626;
}

.dossier-report-card.recommendations {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-left: 4px solid var(--color-primary-navy);
}

.dossier-card-title {
  font-size: 0.92rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.dossier-card-title.strengths {
  color: #166534;
}

.dossier-card-title.weaknesses {
  color: #991b1b;
}

.dossier-card-title.recommendations {
  color: var(--color-primary-navy);
}

.dossier-card-content {
  font-size: 0.98rem;
  line-height: 1.65;
  color: var(--color-text-main);
  flex: 1;
}

.dossier-card-content p {
  margin: 0 0 8px 0;
}

.dossier-card-content p:last-child {
  margin-bottom: 0;
}

/* 3. Section Header & Financial Strip */
.dossier-section-block {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.dossier-section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--color-primary-navy);
}

.section-tag {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--color-text-muted);
  background: #f1f5f9;
  padding: 3px 10px;
  border-radius: 4px;
}

.dossier-financials-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
}

.fin-stat-tile {
  background: #f8fafc;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  text-align: center;
}

.fin-stat-tile.highlight {
  background: var(--color-primary-light);
  border-color: var(--color-primary-navy);
}

.fin-label {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--color-text-light);
  margin-bottom: 4px;
}

.fin-value {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--color-primary-navy);
}

.fin-value.positive {
  color: #16a34a;
}

.fin-value.negative {
  color: #dc2626;
}

.fin-caption {
  font-size: 0.78rem;
  color: var(--color-text-muted);
  margin-top: 4px;
}

/* 4. Tables Grid (Rubric & Cohort Standings) */
.dossier-tables-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
  gap: 20px;
}

.dossier-table-box {
  background: #ffffff;
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-sm);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.dossier-table-header {
  padding: 14px 18px;
  background: #f8fafc;
  border-bottom: 1px solid var(--color-border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.academic-badge {
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--color-primary-navy);
  color: #ffffff;
  padding: 2px 8px;
  border-radius: 4px;
}

.dossier-table {
  font-size: 0.92rem;
  margin-bottom: 0;
}

.criterion-name {
  font-weight: 700;
  color: var(--color-primary-navy);
  font-size: 0.96rem;
}

.criterion-desc {
  font-size: 0.82rem;
  color: var(--color-text-muted);
  line-height: 1.4;
  margin-top: 3px;
}

.table-total-row {
  background: #f8fafc;
  border-top: 2px solid var(--color-primary-navy);
  font-weight: 800;
}

.current-team-row {
  background: var(--color-primary-light) !important;
}

.you-badge {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--color-primary-navy);
}

/* 5. Bottom Action Bar */
.dossier-action-bar {
  background: var(--color-primary-light);
  border: 1px solid var(--color-primary-border);
  border-radius: var(--radius-md);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.dossier-action-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.dossier-action-info strong {
  font-size: 1.05rem;
  color: var(--color-primary-navy);
}

.dossier-action-info span {
  font-size: 0.84rem;
  color: var(--color-text-main);
}

/* ==========================================================================
   Submission Modal
   ========================================================================== */

.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(10, 28, 46, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: var(--space-md);
}

.modal-dialog {
  background: var(--color-white);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-primary-navy);
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 30px rgba(15, 41, 66, 0.15);
  overflow: hidden;
}

.modal-header {
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--color-border-subtle);
  background: var(--color-primary-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--color-primary-navy);
}

.modal-body {
  padding: var(--space-lg);
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: var(--space-md) var(--space-lg);
  border-top: 1px solid var(--color-border-subtle);
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Funding Section Box */
.funding-config-box {
  background: var(--color-primary-light);
  border: 1px solid var(--color-primary-border);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  margin-top: var(--space-md);
}

.radio-group {
  display: flex;
  gap: var(--space-lg);
  margin-bottom: var(--space-sm);
}

.radio-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--color-primary-navy);
  cursor: pointer;
}

/* Toast Notifications */
.app-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background-color: var(--color-primary-navy);
  color: var(--color-white);
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(10, 28, 46, 0.2);
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes pulseDot {
  0%, 100% { opacity: 0.2; transform: scale(0.85); }

 * Academic Business Strategy Simulation Platform
 * Central Configurable Scoring Framework (Prompt 3 Implementation)
 * 
 * Configurable 7-criterion framework with deterministic application-side arithmetic.
 * Historical configurations are preserved per quarter evaluation.
 */
const INITIAL_SCORING_CRITERIA = [
  {
    id: 'strategicDecisionQuality',
    label: 'Strategic decision quality',
    weight: 20,
    description: 'Alignment with customer needs, feasibility, and business model coherence.'
  },
  {
    id: 'reasoningAndEvidence',
    label: 'Reasoning and use of evidence',
    weight: 15,
    description: 'Explanation connecting actions to objectives, trade-offs, and explicit assumptions.'
  },
  {
    id: 'marketAdaptability',
    label: 'Adaptability to market changes',
    weight: 20,
    description: 'Response to competitor moves, regulatory shifts, and emerging industry dynamics.'
  },
  {
    id: 'financialManagement',
    label: 'Financial management and sustainability',
    weight: 15,
    description: 'Runway discipline, margin realism, unit economics, and cash burn.'
  },
  {
    id: 'competitivePerformance',
    label: 'Competitive performance',
    weight: 10,
    description: 'Relative differentiation, defensibility, and market share positioning.'
  },
  {
    id: 'riskAssessment',
    label: 'Risk assessment and contingency planning',
    weight: 10,
    description: 'Anticipation of failure modes, operational risks, and downside buffers.'
  },
  {
    id: 'learningFromDecisions',
    label: 'Learning from previous decisions',
    weight: 10,
    description: 'Correction of past flaws and iterative strategic compounding.'
  }
];
class ScoringService {
  constructor(criteria = INITIAL_SCORING_CRITERIA) {
    this.criteria = JSON.parse(JSON.stringify(criteria));
  }

  /**
   * Returns current active scoring criteria configuration with weights.
   */
  getCriteria() {
    return JSON.parse(JSON.stringify(this.criteria));
  }

  /**
   * Returns weights as a key-value map { criterionId: weightNumber }.
   */
  getWeightsMap() {
    const map = {};
    for (const c of this.criteria) {
      map[c.id] = c.weight;
    }
    return map;
  }

  /**
   * Validates a candidate weight configuration:
   * 1. Every weight must be a non-negative number.
   * 2. The sum of all weights must equal 100%.
   */
  validateWeights(newWeightsMap) {
    let sum = 0;
    const errors = [];

    for (const c of this.criteria) {
      const val = Number(newWeightsMap[c.id]);
      if (isNaN(val) || val < 0) {
        errors.push(`Weight for "${c.label}" must be a non-negative number.`);
      } else {
        sum += val;
      }
    }

    if (Math.round(sum) !== 100) {
      errors.push(`Total weights must sum to exactly 100%. Current sum: ${Math.round(sum)}%.`);
    }

    return {
      isValid: errors.length === 0,
      sum: Math.round(sum),
      errors
    };
  }

  /**
   * Updates scoring configuration. Future evaluations use this configuration.
   * Historical evaluations retain the configuration used at their time of scoring.
   */
  setWeights(newWeightsMap) {
    const validation = this.validateWeights(newWeightsMap);
    if (!validation.isValid) {
      throw new Error(validation.errors.join(' '));
    }

    this.criteria = this.criteria.map((c) => ({
      ...c,
      weight: Number(newWeightsMap[c.id])
    }));

    return true;
  }

  /**
   * Deterministic application-side calculation of the quarterly score.
   * Gemini provides individual criterion scores (0-100) and qualitative rationales,
   * but the weighted total is strictly calculated via deterministic arithmetic.
   *
   * @param {Object} rawScoresMap - { [criterionId]: number (0-100) }
   * @param {Object} weightsMap - Optional historical weights map, defaults to active weights
   * @returns {Object} { totalScore, breakdown: [ { id, label, weight, score, contribution, explanation, evidence, missing } ] }
   */
  calculateQuarterScore(rawScoresMap = {}, explanationsMap = {}, weightsMap = null) {
    const activeWeights = weightsMap || this.getWeightsMap();
    let weightedSum = 0;
    const breakdown = [];

    for (const c of this.criteria) {
      const weight = typeof activeWeights[c.id] === 'number' ? activeWeights[c.id] : c.weight;
      const rawScore = typeof rawScoresMap[c.id] === 'number'
        ? Math.max(0, Math.min(100, Math.round(rawScoresMap[c.id])))
        : 75; // Baseline reasonable fallback if unassigned

      const contribution = Number(((rawScore * weight) / 100).toFixed(2));
      weightedSum += contribution;

      const evalMeta = explanationsMap[c.id] || {};
      breakdown.push({
        id: c.id,
        label: c.label,
        weight,
        score: rawScore,
        contribution,
        explanation: evalMeta.explanation || evalMeta.feedback || 'Evaluated against quarter strategy submission.',
        evidence: evalMeta.evidence || 'Derived from student submission and market response.',
        missingAssumptions: evalMeta.missing_assumptions || evalMeta.missingAssumptions || null
      });
    }

    const finalTotalScore = Math.min(100, Math.max(0, Math.round(weightedSum)));

    return {
      totalScore: finalTotalScore,
      weightedSum: Number(weightedSum.toFixed(2)),
      weightsUsed: { ...activeWeights },
      breakdown
    };
  }

  /**
   * Computes the cumulative score for a team based strictly on evaluated quarters.
   * Calculated as the arithmetic mean of completed quarterly scores.
   * Incomplete quarters are never averaged in.
   */
  computeCumulativeScore(quarterlyData) {
    const evaluatedQuarters = (quarterlyData || []).filter(
      (q) => q.status === 'evaluated' && typeof q.score === 'number' && !isNaN(q.score)
    );

    if (evaluatedQuarters.length === 0) {
      return 0;
    }

    const sum = evaluatedQuarters.reduce((acc, q) => acc + q.score, 0);
    return Math.round(sum / evaluatedQuarters.length);
  }

  /**
   * Generates a personalized report card structure for a team and quarter.
   */
  getPersonalizedReportCard(team, quarterNum) {
    const qData = team.quarterlyData?.find((q) => q.quarter === quarterNum);
    const prevQData = team.quarterlyData?.find((q) => q.quarter === quarterNum - 1);

    const isEvaluated = qData?.status === 'evaluated' && qData?.score !== null;

    return {
      isEvaluated,
      quarter: quarterNum,
      dates: qData?.dates || '',
      currentQuarterScore: isEvaluated ? qData.score : null,
      cumulativeScore: team.cumulativeScore || 0,
      previousQuarterScore: (prevQData?.status === 'evaluated' && prevQData?.score !== null) ? prevQData.score : null,
      scoreExplanation: qData?.scoreExplanation || qData?.evaluationFeedback?.scoreExplanation || '',
      whatWentRight: qData?.whatWentWell || qData?.strengths || 'Clear strategic focus in targeted micro-segment.',
      whatWentWrong: qData?.mistakesWeaknesses || qData?.mistakes || 'Operational bottleneck in rapid fulfillment logistics.',
      recommendedImprovements: qData?.nextQuarterImplications || qData?.recommendedImprovements || 'Optimize unit economics and secure supplier credit terms.',
      strategicDepthScore: qData?.strategicDepthScore !== undefined ? qData.strategicDepthScore : 75,
      strategicDepthLevel: qData?.strategicDepthLevel || 'Moderate (Basic Detail)',
      strategicDepthFeedback: qData?.strategicDepthFeedback || 'Assessed against operational clarity and unit economics.',
      howToImproveDepth: qData?.howToImproveDepth || 'Elaborate on unit margins, partner SLAs, and cluster delivery economics.',
      breakdown: qData?.criterionBreakdown || [],
      weightsUsed: qData?.scoringWeightsUsed || this.getWeightsMap(),
      financials: qData?.financialIndicators || null,
      marketShare: qData?.marketShare || null,
      revenue: qData?.financialIndicators?.revenue || null,
      operatingProfitOrLoss: qData?.financialIndicators?.operatingProfitOrLoss || null,
      cashBalance: qData?.financialIndicators?.cashBalance || null
    };
  }

  formatScore(score) {
    if (score === null || score === undefined) return 'Awaiting evaluation';
    return `${score} / 100`;
  }
}

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);
        const data = await res.json();

        if (data.reply) {
          this.addChatMessage(team.id, 0, data.reply, 'ai');
        }

        team.businessDescription = {
          idea: userText,
          summary: data.reply
        };

        // Transition from Ideation into Quarter 1 (Indian FY: Apr 2024 – Jun 2024)!
        team.currentQuarter = 1;
        team.status = 'in-progress';
        const q1Index = team.quarterlyData.findIndex((q) => q.quarter === 1);
        if (q1Index !== -1) {
          team.quarterlyData[q1Index].status = 'in-progress';
        }

        for (const t of this.state.teams) {
          if (t.id !== team.id && t.currentQuarter === 0) {
            t.currentQuarter = 1;
            t.status = 'in-progress';
            const cQ1Idx = t.quarterlyData.findIndex((q) => q.quarter === 1);
            if (cQ1Idx !== -1) {
              t.quarterlyData[cQ1Idx].status = 'in-progress';
            }
          }
        }

        // Initialize Quarter 1 conversation (generates Market Intelligence Briefing before first message)
        this.getConversation(team.id, 1);

        this.showNotification(`Startup foundation registered! Quarter 1 (Apr 2024 – Jun 2024) is now live.`);
      } catch (err) {
        console.error('[IDEATION ERROR]', err);
        this.state.lastError = err.message || 'Failed to register startup idea.';
        this.addChatMessage(team.id, 0, `⚠️ Error: ${this.state.lastError}. Please try again.`, 'system');
      } finally {
        this.state.isAITyping = false;
        this.notify();
      }
      return;
    }

    // 1. Add student message immediately for quarterly turn
    this.addChatMessage(team.id, qNum, userText, 'student');

    // 2. Set typing state
    this.state.isAITyping = true;
    this.state.lastError = null;
    this.notify();

    try {
      const previousStrategies = team.quarterlyData
        .filter((q) => q.quarter < qNum && q.strategy)
        .map((q) => ({ quarter: q.quarter, strategy: q.strategy, reasoning: q.reasoning }));

      const previousResults = team.quarterlyData
        .filter((q) => q.quarter < qNum && q.resultsAvailable)
        .map((q) => ({
          quarter: q.quarter,
          marketShare: q.marketShare,
          financials: q.financialIndicators,
          score: q.score
        }));

      const payload = {
        teamName: team.name,
        industryName: industry.name,
        geographicScope: industry.geographicScope,
        industrySummary: industry.summary,
        currentQuarter: qNum,
        quarterDates: qMeta.dates,
        businessDescription: team.businessDescription || {},
        financialPosition: team.financialPosition || { cash: '₹3.50 Cr', debt: 'None' },
        previousStrategies,
        previousResults,
        conversationHistory: this.getConversation(team.id, qNum),
        userMessage: userText
      };

      const res = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.error || `Server returned HTTP ${res.status}`);
      }

      const data = await res.json();

      // 3. Add AI message
      if (data.reply) {
        this.addChatMessage(team.id, qNum, data.reply, 'ai');
      }

      // 4. Handle metadata extractions
      if (data.meta) {
        if (data.meta.detected_strategy) {
          this.state.draftSubmission.strategy = data.meta.detected_strategy;
        }
        if (data.meta.detected_reasoning) {
          this.state.draftSubmission.reasoning = data.meta.detected_reasoning;
        }
        if (data.meta.funding_decision) {
          const fd = data.meta.funding_decision;
          if (fd.required || fd.terms) {
            this.state.draftSubmission.fundingRequired = true;
            if (fd.amount) this.state.draftSubmission.fundingAmount = fd.amount;
            if (fd.terms) this.state.draftSubmission.fundingPurpose = fd.terms;
          }
        }

        // 5. When quarter chatting is completed, automatically lock & evaluate all 5 teams!
        if (data.meta.quarter_completed) {
          const studentMsgs = this.getConversation(team.id, qNum).filter((m) => m.sender === 'student');
          const finalStrat = this.state.draftSubmission.strategy || (studentMsgs[0] ? studentMsgs[0].text : 'Differentiated positioning and operational expansion');
          const finalReason = this.state.draftSubmission.reasoning || (studentMsgs[1] ? studentMsgs[1].text : 'Maximizing gross margin and defensible unit economics');
          const finalFund = {
            required: Boolean(this.state.draftSubmission.fundingRequired),
            amount: this.state.draftSubmission.fundingAmount || '',
            type: this.state.draftSubmission.fundingType || 'Equity Investment',
            purpose: this.state.draftSubmission.fundingPurpose || 'Operational working capital'
          };

          if (qIndex !== -1) {
            team.quarterlyData[qIndex].strategy = finalStrat;
            team.quarterlyData[qIndex].reasoning = finalReason;
            team.quarterlyData[qIndex].fundingRequest = finalFund;
            team.quarterlyData[qIndex].status = 'submitted';
          }
          team.status = 'submitted';

          this.addChatMessage(
            team.id,
            qNum,
            `🏁 Quarter ${qNum} chatting is now complete! Evaluating performance for all 5 teams in ${industry.name}...`,
            'system'
          );

          // Automatically trigger the simulation & deterministic scoring for all 5 teams
          await this.executeQuarterSimulation(team.id, qNum);
        }
      }
    } catch (err) {
      console.error('[CHAT ERROR]', err);
      this.state.lastError = err.message || 'Failed to reach Gemini simulation backend.';
      this.addChatMessage(
        team.id,
        qNum,
        `⚠️ Simulation backend error: ${this.state.lastError}. Please check your connection or try again.`,
        'system'
      );
    } finally {
      this.state.isAITyping = false;
      this.notify();
    }
  }

  setDraftSubmission(patch, silent = false) {
    this.state.draftSubmission = {
      ...this.state.draftSubmission,
      ...patch
    };
    if (!silent) {
      this.notify();
    }
  }

  openSubmissionModal() {
    this.syncDraftForCurrentTeam();
    this.state.isSubmissionModalOpen = true;
    this.notify();
  }

  closeSubmissionModal() {
    this.state.isSubmissionModalOpen = false;
    this.notify();
  }

  toggleMarketSnapshot(forcedState = null) {
    if (forcedState !== null) {
      this.state.isSnapshotOpen = Boolean(forcedState);
    } else {
      this.state.isSnapshotOpen = !this.state.isSnapshotOpen;
    }
    this.notify();
  }

  // --- Submission & Outcome Execution ---

  async submitQuarterStrategy(teamId, quarterNum, data) {
    const team = this.state.teams.find((t) => t.id === teamId);
    if (!team) return;

    const qIndex = team.quarterlyData.findIndex((q) => q.quarter === quarterNum);
    if (qIndex === -1) return;

    team.quarterlyData[qIndex] = {
      ...team.quarterlyData[qIndex],
      status: 'submitted',
      strategy: data.strategy,
      reasoning: data.reasoning,
      fundingRequest: {
        required: Boolean(data.fundingRequired),
        amount: data.fundingRequired ? data.fundingAmount : '',
        type: data.fundingRequired ? data.fundingType : 'None',
        purpose: data.fundingRequired ? data.fundingPurpose : ''
      }
    };

    team.status = 'submitted';
    this.state.submissionConfirmed = true;

    // Record submission notice in chat
    const conv = this.getConversation(teamId, quarterNum);
    conv.push({
      id: `sys-sub-${Date.now()}`,
      sender: 'system',
      text: `Quarter ${quarterNum} strategy submission committed. Running Gemini market outcome simulation for all 5 teams...`,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      quarter: quarterNum
    });

    this.showNotification(`Quarter ${quarterNum} strategy submitted! Evaluating all 5 cohort teams...`);
    this.notify();

    // Trigger simulation outcome generation
    await this.executeQuarterSimulation(teamId, quarterNum);
  }

  async executeQuarterSimulation(teamId, quarterNum) {
    const team = this.state.teams.find((t) => t.id === teamId);
    if (!team) return;

    const qIndex = team.quarterlyData.findIndex((q) => q.quarter === quarterNum);
    if (qIndex === -1) return;

    const qData = team.quarterlyData[qIndex];
    const prevQData = team.quarterlyData.find((q) => q.quarter === quarterNum - 1) || {};
    const industry = this.getIndustry(team.industryId);
    const qMeta = this.getQuarter(quarterNum);

    this.state.isEvaluating = true;
    this.state.lastError = null;
    this.notify();

    try {
      const cohortTeams = this.state.teams
        .filter((t) => t.id !== teamId)
        .map((t) => ({ id: t.id, name: t.name }));

      const payload = {
        teamName: team.name,
        industryName: industry.name,
        industrySummary: industry.summary,
        competitors: industry.competitors,
        quarter: quarterNum,
        quarterDates: qMeta.dates,
        strategy: qData.strategy || 'Customer-centric delivery network and curated merchandise',
        reasoning: qData.reasoning || 'Focusing on high-margin customer retention rather than mass discount subsidies',
        fundingRequest: qData.fundingRequest,
        financialPosition: team.financialPosition,
        cohortTeams,
        previousQuarterData: {
          marketShare: prevQData.marketShare || '0%',
          revenue: prevQData.financialIndicators?.revenue || '₹0',
          cash: team.financialPosition?.cash || '₹3.50 Cr'
        }
      };

      const res = await fetch(API_BASE + '/api/simulate-quarter', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.error || `Simulation server returned HTTP ${res.status}`);
      }

      const jsonResp = await res.json();
      const outcome = jsonResp.outcome;
      const activeEval = outcome.active_team || outcome;

      // 1. Calculate deterministic application-side score for active team
      const rawScores = {};
      const explanations = {};
      for (const [k, v] of Object.entries(activeEval.criterion_evaluations || {})) {
        rawScores[k] = v.score;
        explanations[k] = v;
      }
      const scoreResult = scoringService.calculateQuarterScore(rawScores, explanations);

      qData.status = 'evaluated';
      qData.score = scoreResult.totalScore;
      qData.criterionBreakdown = scoreResult.breakdown;
      qData.scoringWeightsUsed = scoreResult.weightsUsed;
      qData.scoreExplanation = activeEval.score_explanation || 'Comprehensive evaluation across 7 academic criteria.';
      qData.whatWentWell = activeEval.what_went_right || activeEval.strengths || 'Strong product differentiation in target customer segment.';
      qData.mistakesWeaknesses = activeEval.what_went_wrong || activeEval.mistakes || 'Operational delivery bottlenecks during morning peak demand.';
      qData.nextQuarterImplications = activeEval.recommended_improvements || 'Optimize supplier terms and expand repeat customer retention.';
      qData.strategicDepthScore = activeEval.strategic_depth_score !== undefined ? activeEval.strategic_depth_score : (activeEval.strategicDepthScore || 75);
      qData.strategicDepthLevel = activeEval.strategic_depth_level || activeEval.strategicDepthLevel || 'Moderate (Basic Detail)';
      qData.strategicDepthFeedback = activeEval.strategic_depth_feedback || activeEval.strategicDepthFeedback || 'Assessed against operational clarity and unit economics.';
      qData.howToImproveDepth = activeEval.how_to_improve_depth || activeEval.howToImproveDepth || 'Elaborate on unit margins, partner SLAs, and cluster delivery economics.';
      qData.marketShare = activeEval.market_share || '14.2%';
      qData.financialIndicators = {
        revenue: activeEval.revenue || '₹2.40 Cr',
        grossMargin: activeEval.gross_margin || '28.5%',
        operatingProfitOrLoss: activeEval.operating_profit_or_loss || '-₹15.2 L',
        cashBalance: activeEval.cash_balance || '₹2.85 Cr',
        debtBalance: activeEval.debt_balance || 'None',
        unitsSold: activeEval.units_sold || '165,000 orders'
      };
      qData.resultsAvailable = true;

      // Update cash and debt balances deterministically
      if (activeEval.cash_balance) {
        team.financialPosition.cash = activeEval.cash_balance;
      }
      if (activeEval.debt_balance) {
        team.financialPosition.debt = activeEval.debt_balance;
      }

      team.cumulativeScore = scoringService.computeCumulativeScore(team.quarterlyData);
      team.status = 'evaluated';

      // 2. Evaluate and score the other 4 cohort teams in this industry
      if (Array.isArray(outcome.cohort_evaluations)) {
        for (const cEval of outcome.cohort_evaluations) {
          const cTeam = this.state.teams.find((t) => t.id === cEval.team_id);
          if (cTeam) {
            const cQData = cTeam.quarterlyData.find((q) => q.quarter === quarterNum);
            if (cQData) {
              const cRawScores = {};
              const cExplanations = {};
              for (const [k, v] of Object.entries(cEval.criterion_evaluations || {})) {
                cRawScores[k] = v.score;
                cExplanations[k] = v;
              }
              const cScoreResult = scoringService.calculateQuarterScore(cRawScores, cExplanations);

              cQData.status = 'evaluated';
              cQData.strategy = cEval.strategy_summary || 'Alternative competitive deployment.';
              cQData.score = cScoreResult.totalScore;
              cQData.criterionBreakdown = cScoreResult.breakdown;
              cQData.scoringWeightsUsed = cScoreResult.weightsUsed;
              cQData.whatWentWell = cEval.what_went_right || 'Strong brand reach in target market.';
              cQData.mistakesWeaknesses = cEval.what_went_wrong || 'Subsidies impacted unit contribution.';
              cQData.nextQuarterImplications = cEval.recommended_improvements || 'Curtail discounts and improve retention.';
              cQData.marketShare = cEval.market_share || '20.0%';
              cQData.financialIndicators = {
                revenue: cEval.revenue || '₹2.80 Cr',
                grossMargin: cEval.gross_margin || '20.0%',
                operatingProfitOrLoss: cEval.operating_profit_or_loss || '-₹20.0 L',
                cashBalance: cEval.cash_balance || '₹2.50 Cr',
                debtBalance: cEval.debt_balance || 'None',
                unitsSold: cEval.units_sold || '200,000 orders'
              };
              cQData.resultsAvailable = true;
              cTeam.cumulativeScore = scoringService.computeCumulativeScore(cTeam.quarterlyData);
              cTeam.status = 'evaluated';
            }
          }
        }
      }

      // Automatically open market snapshot drawer to show results
      this.state.isSnapshotOpen = true;

      // Add completion announcement in chat
      const conv = this.getConversation(teamId, quarterNum);
      conv.push({
        id: `sys-eval-${Date.now()}`,
        sender: 'system',
        text: `📊 **Quarter ${quarterNum} Evaluation Complete!** Score: **${qData.score} / 100**. All 5 cohort teams have been evaluated. Review your personalized report card, 6-metric financial strip, 7-criterion rubric, and cohort standings below.`,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        quarter: quarterNum
      });

      this.showNotification(`Quarter ${quarterNum} evaluated (${qData.score}/100)!`);
    } catch (err) {
      console.error('[SIMULATION EVALUATION ERROR]', err);
      this.state.lastError = err.message;
      this.showNotification(`Simulation error: ${err.message}`);
    } finally {
      this.state.isEvaluating = false;
      this.notify();
    }
  }

  updateScoringWeights(newWeightsMap) {
    try {
      scoringService.setWeights(newWeightsMap);
      this.showNotification('Scoring configuration updated successfully! Future evaluations will use new weights.');
      this.notify();
      return { success: true };
    } catch (err) {
      this.showNotification(`Scoring weight error: ${err.message}`);
      return { success: false, error: err.message };
    }
  }

  recordQuarterEvaluation(teamId, quarterNum, evaluation) {
    const team = this.state.teams.find((t) => t.id === teamId);
    if (!team) return;

    const qIndex = team.quarterlyData.findIndex((q) => q.quarter === quarterNum);
    if (qIndex === -1) return;

    const qData = team.quarterlyData[qIndex];
    qData.status = 'evaluated';
    qData.score = evaluation.score || 82;
    qData.marketShare = evaluation.marketShare || '14.8%';
    qData.financialIndicators = evaluation.financialIndicators || {
      revenue: '₹1.85 Cr',
      profitLoss: '-₹32.4 L',
      cashBalance: '₹2.90 Cr'
    };
    qData.whatWentWell = evaluation.whatWentWell || 'Strong market selection in Tier-1 tech corridors.';
    qData.mistakesWeaknesses = evaluation.mistakesWeaknesses || 'Excessive introductory promo discounting compressed margins.';
    qData.marketResponseEvaluation = evaluation.marketResponseEvaluation || 'Competitors responded with targeted hyper-local promotions.';
    qData.resultsAvailable = true;

    team.cumulativeScore = scoringService.computeCumulativeScore(team.quarterlyData) || qData.score;
    team.status = 'evaluated';

    this.showNotification(`Quarter ${quarterNum} evaluation recorded for ${team.name}`);
    this.notify();
  }

  advanceToNextQuarter(teamId = null) {
    const tid = teamId || this.state.activeTeamId;
    const team = this.state.teams.find((t) => t.id === tid);
    if (!team) return;

    if (team.currentQuarter < 8) {
      const nextQ = team.currentQuarter + 1;
      team.currentQuarter = nextQ;
      const nextQIndex = team.quarterlyData.findIndex((q) => q.quarter === nextQ);
      if (nextQIndex !== -1) {
        team.quarterlyData[nextQIndex].status = 'in-progress';
      }
      team.status = 'in-progress';

      // Also advance the other 4 cohort teams so cohort quarters stay aligned
      for (const t of this.state.teams) {
        if (t.id !== team.id && t.currentQuarter < nextQ) {
          t.currentQuarter = nextQ;
          const cNextIdx = t.quarterlyData.findIndex((q) => q.quarter === nextQ);
          if (cNextIdx !== -1) {
            t.quarterlyData[cNextIdx].status = 'in-progress';
          }
          t.status = 'in-progress';
        }
      }

      this.state.submissionConfirmed = false;
      this.state.isSnapshotOpen = false;
      this.state.draftSubmission = {
        strategy: '',
        reasoning: '',
        fundingRequired: false,
        fundingAmount: '',
        fundingType: 'Equity Investment',
        fundingPurpose: ''
      };

      // Ensure conversation greeting exists for next quarter
      this.getConversation(team.id, nextQ);

      this.showNotification(`Advanced to Quarter ${nextQ} (${this.getQuarter(nextQ).dates})`);
      this.notify();
    } else {
      this.showNotification(`Simulation complete! All 8 quarters finished. View final rankings in Professor mode.`);
    }
  }

  showNotification(text) {
    this.state.notification = text;
    this.notify();
    if (this._notifTimeout) clearTimeout(this._notifTimeout);
    this._notifTimeout = setTimeout(() => {
      this.state.notification = null;
      this.notify();
    }, 3500);
  }
}

          title="Switch User Role"

          ${avatarLetter}

          <div class="dropdown-header">Switch User Role</div>
          <button 
            type="button" 
            class="dropdown-item ${isStudent ? 'active' : ''}" 
            id="btn-switch-student"
          >
            <span>Switch to Student</span>
            ${isStudent ? '<span class="check">✓</span>' : ''}

          <button 
            type="button" 
            class="dropdown-item ${!isStudent ? 'active' : ''}" 
            id="btn-switch-professor"
          >
            <span>Switch to Professor</span>
            ${!isStudent ? '<span class="check">✓</span>' : ''}
          </button>

          ${
            isStudent
              ? `
            <div class="dropdown-header" style="margin-top: 8px;">Active Student Team</div>
            ${state.teams
              .map(
                (t) => `
              <button 
                type="button" 
                class="dropdown-item ${t.id === state.activeTeamId ? 'active' : ''}" 
                data-switch-team="${t.id}"
                style="font-size: 0.82rem;"
              >
                <span>${t.name}</span>
                ${t.id === state.activeTeamId ? '<span class="check">✓</span>' : ''}
              </button>
            `
              )
              .join('')}
          `
              : ''
          }
        </div>
      </div>
    </header>
  `;
}
function initHeaderEvents() {
  const profileBtn = document.getElementById('profile-dropdown-btn');
  const dropdownMenu = document.getElementById('profile-dropdown-menu');
  const brandHome = document.getElementById('nav-brand-home');

  if (profileBtn && dropdownMenu) {
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = dropdownMenu.classList.contains('open');
      dropdownMenu.classList.toggle('open', !isOpen);
      profileBtn.setAttribute('aria-expanded', !isOpen);
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!profileBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.remove('open');
        profileBtn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  const btnStudent = document.getElementById('btn-switch-student');
  if (btnStudent) {
    btnStudent.addEventListener('click', () => {
      dropdownMenu?.classList.remove('open');
      store.setRole('student');
    });
  }

  const btnProf = document.getElementById('btn-switch-professor');
  if (btnProf) {
    btnProf.addEventListener('click', () => {
      dropdownMenu?.classList.remove('open');
      store.setRole('professor');
    });
  }

  if (brandHome) {
    brandHome.addEventListener('click', () => {
      const state = store.getState();
      if (state.currentRole === 'professor') {
        store.setView('professor-dashboard', { teamId: null });
      } else {
        store.setView('student-chat');
      }
    });
  }

  // Active student team switcher
  document.querySelectorAll('[data-switch-team]').forEach((el) => {
    el.addEventListener('click', (e) => {
      const teamId = e.currentTarget.getAttribute('data-switch-team');
      dropdownMenu?.classList.remove('open');
      store.setActiveTeam(teamId);
    });
  });
}

function renderStudentLanding() {

  const industry = store.getIndustry(team.industryId);

function initStudentLandingEvents() {
  const enterBtn = document.getElementById('btn-enter-simulation');
  if (enterBtn) {
    enterBtn.addEventListener('click', () => {
      store.setView('student-chat');
    });
  }

  // Framework Tabs
  document.querySelectorAll('[data-target-tab]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const targetId = btn.getAttribute('data-target-tab');
      activeTabId = targetId;

      document.querySelectorAll('.overview-tab-btn').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach((p) => p.classList.remove('active'));

      btn.classList.add('active');
      const pane = document.getElementById(targetId);
      if (pane) pane.classList.add('active');
    });
  });
}

/**

 * - Personalized Report Card ("What went right" & "What went wrong")

  const state = store.getState();

  const currentQ = store.getQuarter(currentQNum);
  const isCollapsed = !state.isSnapshotOpen;

  // Evaluated data for current quarter or most recent quarter with results
  const currentQData = team.quarterlyData.find((q) => q.quarter === currentQNum);
  const previousQData = team.quarterlyData.slice().reverse().find((q) => q.resultsAvailable);

  const displayData = currentQData?.resultsAvailable ? currentQData : (previousQData || currentQData);
  const hasResults = Boolean(displayData && displayData.resultsAvailable);
  const reportCard = scoringService.getPersonalizedReportCard(team, displayData?.quarter || currentQNum);

  // Get all cohort teams in the same industry sorted by cumulative score
  const cohortTeams = state.teams
    .filter((t) => t.industryId === team.industryId)
    .map((t) => {
      const qd = t.quarterlyData.find((q) => q.quarter === (displayData?.quarter || currentQNum));
      return {
        id: t.id,
        name: t.name,
        isCurrent: t.id === team.id,
        quarterScore: qd?.score !== null && qd?.score !== undefined ? qd.score : '—',
        cumulativeScore: t.cumulativeScore || 0,
        marketShare: qd?.marketShare || '—',
        revenue: qd?.financialIndicators?.revenue || '—'

    .sort((a, b) => (typeof b.quarterScore === 'number' ? b.quarterScore : 0) - (typeof a.quarterScore === 'number' ? a.quarterScore : 0));

  return `

      <div class="snapshot-header">
        <div>
          <div class="snapshot-title">Market Snapshot & Report Card</div>
          <div style="font-size: 0.75rem; color: var(--color-text-light);">

        </div>
        <button 
          type="button"

            <span style="font-size: 0.72rem; font-weight: 700; background: var(--color-primary-navy); color: var(--color-white); padding: 2px 8px; border-radius: 4px;">
              ${reportCard.isEvaluated ? 'Evaluated' : 'Awaiting Submission'}

            <div style="background: var(--color-white); padding: 8px 12px; border-radius: 4px; border: 1px solid var(--color-border-subtle);">
              <div style="font-size: 0.7rem; color: var(--color-text-light); text-transform: uppercase; font-weight: 700;">Quarter Score</div>
              <div style="font-size: 1.35rem; font-weight: 800; color: var(--color-primary-navy);">
                ${reportCard.currentQuarterScore !== null ? `${reportCard.currentQuarterScore} / 100` : '—'}

            </div>
            <div style="background: var(--color-white); padding: 8px 12px; border-radius: 4px; border: 1px solid var(--color-border-subtle);">

                ${reportCard.cumulativeScore > 0 ? `${reportCard.cumulativeScore} / 100` : '—'}

            <strong>Previous Quarter Score:</strong> 
            ${reportCard.previousQuarterScore !== null ? `${reportCard.previousQuarterScore} / 100` : 'None (Starting Quarter)'}
          </div>
        </div>

        ${
          !hasResults
            ? `
          <!-- Empty State when Results not yet evaluated -->
          <div class="empty-neutral-state">
            <svg style="width: 32px; height: 32px; margin: 0 auto 8px; color: var(--color-primary-navy); display: block;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <!-- Industry Reference Competitor Shares -->
          <div class="snapshot-card">
            <div class="snapshot-card-title">Industry Reference Landscape</div>
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem;">
              ${industry.competitors.map(c => `
                <div style="display: flex; justify-content: space-between;">

          <div class="snapshot-card" style="border-left: 3px solid #dc2626; background: #fef2f2;">
            <div style="font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: #991b1b; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
              <span>⚠</span> What Went Wrong (Mistakes & Weaknesses)

          <div class="snapshot-card" style="border-left: 3px solid var(--color-primary-navy);">

            </div>
            <div style="font-size: 0.84rem; color: var(--color-text-main); line-height: 1.5;">
              ${reportCard.recommendedImprovements}

          </div>

          <!-- 7 Evaluation Criteria Breakdown Table -->
          <div class="snapshot-card" style="padding: 10px;">
            <div class="snapshot-card-title" style="margin-bottom: 8px;">
              7-Criterion Academic Evaluation Framework
            </div>
            <div class="table-responsive">
              <table class="academic-table" style="font-size: 0.78rem;">
                <thead>
                  <tr>
                    <th>Criterion</th>

                    <th style="text-align: center; width: 14%;">Score</th>

                      <td style="text-align: right; font-weight: 800; color: var(--color-primary-navy);">${item.contribution}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Financial Performance & Cash Reconciliation -->
          <div class="snapshot-card">
            <div class="snapshot-card-title">Financial Position & Unit Economics</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.82rem;">
              <div style="background: #f8fafc; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--color-border-subtle);">
                <div style="font-size: 0.7rem; color: var(--color-text-muted);">Quarter Revenue</div>
                <div style="font-weight: 700; color: var(--color-primary-navy);">${displayData.financialIndicators?.revenue || '—'}</div>
              </div>
              <div style="background: #f8fafc; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--color-border-subtle);">
                <div style="font-size: 0.7rem; color: var(--color-text-muted);">Gross Margin</div>
                <div style="font-weight: 700; color: var(--color-primary-navy);">${displayData.financialIndicators?.grossMargin || '—'}</div>
              </div>
              <div style="background: #f8fafc; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--color-border-subtle);">
                <div style="font-size: 0.7rem; color: var(--color-text-muted);">Operating Profit / Loss</div>
                <div style="font-weight: 700; color: ${displayData.financialIndicators?.operatingProfitOrLoss?.includes('-') ? '#dc2626' : '#059669'};">
                  ${displayData.financialIndicators?.operatingProfitOrLoss || displayData.financialIndicators?.profitLoss || '—'}
                </div>
              </div>
              <div style="background: #f8fafc; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--color-border-subtle);">
                <div style="font-size: 0.7rem; color: var(--color-text-muted);">Cash Balance</div>

/**
 * Academic Business Strategy Simulation Platform
 * Submission Confirmation & Funding Review Modal Flow with Gemini Simulation
 */
function renderSubmissionModal() {
  const state = store.getState();
  if (!state.isSubmissionModalOpen) return '';

  const team = store.getCurrentTeam();
  const currentQ = store.getQuarter(team.currentQuarter);
  const qData = team.quarterlyData.find((q) => q.quarter === team.currentQuarter) || {};

  const draft = state.draftSubmission;
  const isConfirmed = state.submissionConfirmed || (team.status === 'submitted' || team.status === 'evaluated');
  const isEvaluating = state.isEvaluating;
  const resultsAvailable = Boolean(qData.resultsAvailable);
  const isLastQuarter = team.currentQuarter === 8;

  return `
    <div class="modal-backdrop" id="submission-modal-backdrop">
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        
        <!-- Modal Header -->
        <div class="modal-header">
          <div>
            <h3 class="modal-title" id="modal-title">
              ${
                isEvaluating
                  ? `Simulating ${currentQ.name} Market Dynamics...`
