function initSubmissionModalEvents() {
  const backdrop = document.getElementById('submission-modal-backdrop');
  if (!backdrop) return;

  const closeX = document.getElementById('btn-modal-close-x');
  const backEdit = document.getElementById('btn-modal-back-edit');
  const closeDone = document.getElementById('btn-modal-close-done');
  const confirmSubmit = document.getElementById('btn-modal-confirm-submit');
  const viewResults = document.getElementById('btn-modal-view-results');
  const advanceQuarter = document.getElementById('btn-modal-advance-quarter');

  // Funding Radio toggles
  const radioYes = document.getElementById('funding-radio-yes');
  const radioNo = document.getElementById('funding-radio-no');
  const fundingDetails = document.getElementById('funding-details-fields');

  const updateFundingDisplay = () => {
    if (radioYes && fundingDetails) {
      fundingDetails.style.display = radioYes.checked ? 'block' : 'none';
      store.setDraftSubmission({ fundingRequired: radioYes.checked }, true);
    }
  };

  radioYes?.addEventListener('change', updateFundingDisplay);
  radioNo?.addEventListener('change', updateFundingDisplay);

  // Sync text inputs to draft state silently as user types
  document.getElementById('submit-strategy-input')?.addEventListener('input', (e) => {
    store.setDraftSubmission({ strategy: e.target.value }, true);
  });

  document.getElementById('submit-reasoning-input')?.addEventListener('input', (e) => {
    store.setDraftSubmission({ reasoning: e.target.value }, true);
  });

  document.getElementById('funding-amount-input')?.addEventListener('input', (e) => {
    store.setDraftSubmission({ fundingAmount: e.target.value }, true);
  });

  document.getElementById('funding-type-select')?.addEventListener('change', (e) => {
    store.setDraftSubmission({ fundingType: e.target.value }, true);
  });

  document.getElementById('funding-purpose-input')?.addEventListener('input', (e) => {
    store.setDraftSubmission({ fundingPurpose: e.target.value }, true);
  });

  // Action: Go Back and Edit
  const handleClose = () => {
    const state = store.getState();
    if (state.isEvaluating) return;
    store.closeSubmissionModal();
  };

  closeX?.addEventListener('click', handleClose);
  backEdit?.addEventListener('click', handleClose);
  closeDone?.addEventListener('click', handleClose);
  backdrop?.addEventListener('click', (e) => {
    if (e.target === backdrop) {
      handleClose();
    }
  });

  // Action: Confirm Submission (triggers Gemini outcome simulation)
  confirmSubmit?.addEventListener('click', async () => {
    const state = store.getState();
    if (state.isEvaluating) return;

    const team = store.getCurrentTeam();
    const draft = state.draftSubmission;

    if (!draft.strategy || !draft.strategy.trim()) {
      alert('Please enter your proposed strategy before confirming submission.');
      return;
    }

    if (!draft.reasoning || !draft.reasoning.trim()) {
      alert('Please provide your strategic reasoning and economic rationale.');
      return;
    }

    await store.submitQuarterStrategy(team.id, team.currentQuarter, draft);
  });

  // Action: View Quarter Results
  viewResults?.addEventListener('click', () => {
    store.closeSubmissionModal();
    store.toggleMarketSnapshot(true);
  });

  // Action: Proceed to Next Quarter
  advanceQuarter?.addEventListener('click', () => {
    const team = store.getCurrentTeam();
    store.closeSubmissionModal();
    store.advanceToNextQuarter(team.id);
  });
}

/**
 * Renders all quarter conversation sections sequentially from Quarter 0 up to currentQuarter.
 */
function renderAllQuarterSections(team, currentQNum, state) {
  const sections = [];

  // Determine starting quarter to render (render Phase 0 if present, plus all quarters up to currentQuarter)
  const quartersToRender = [];
  if (team.businessDescription?.idea || currentQNum === 0 || state.conversations[team.id]?.[0]) {
    quartersToRender.push(0);
  }
  for (let q = 1; q <= currentQNum; q++) {
    quartersToRender.push(q);
  }

  // If currently at 0, only 0 is rendered
  const uniqueQuarters = [...new Set(quartersToRender)].sort((a, b) => a - b);

  for (const qNum of uniqueQuarters) {
    const qMeta = store.getQuarter(qNum);
    const messages = store.getConversation(team.id, qNum);
    const qData = team.quarterlyData.find((q) => q.quarter === qNum);
    const isEvaluated = Boolean(qData && qData.status === 'evaluated' && qData.resultsAvailable);

    const dividerText = qNum === 0 
      ? '💡 Startup Formation &amp; Ideation Phase (Genesis)' 
      : `📅 ${qMeta.name} (${qMeta.dates}) &bull; ${qMeta.academicYear || 'Indian FY'}`;

    sections.push(`
      <section class="quarter-chat-section" id="quarter-section-${qNum}" data-quarter="${qNum}">
        <!-- Quarter Section Divider -->
        <div class="quarter-chat-divider">
          <span class="divider-line"></span>
          <span class="divider-badge">${dividerText}</span>
          <span class="divider-line"></span>
        </div>

        <!-- Messages for this quarter -->
        <div class="quarter-messages-group">
          ${messages.map((msg) => {
            const isStudent = msg.sender === 'student';
            const isSystem = msg.sender === 'system';
            const senderLabel = isStudent ? team.name : isSystem ? 'Simulation Facilitator' : 'Simulation Facilitator AI (Gemini)';

            return `
              <div class="chat-message ${msg.sender}" id="${msg.id}">
                <div class="message-meta">
                  <span>${senderLabel}</span>
                  <span>&bull;</span>
                  <span>${msg.timestamp}</span>
                </div>
                <div class="message-bubble">${formatChatMessage(msg.text)}</div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Inline Horizontal Evaluation Dossier (Rendered directly in chat when quarter is evaluated) -->
        ${isEvaluated ? renderHorizontalEvaluationDossier(qData, team, state) : ''}
      </section>
    `);
  }

  return sections.join('');
}

/**
 * Renders the Comprehensive Inline Horizontal Evaluation Dossier.
 * Appears horizontally across the chat feed after every evaluated quarter.
 */
function renderHorizontalEvaluationDossier(qData, team, state) {
  const qMeta = store.getQuarter(qData.quarter);
  const nextQMeta = store.getQuarter(qData.quarter + 1);
  const industry = store.getIndustry(team.industryId);
  const reportCard = scoringService.getPersonalizedReportCard(team, qData.quarter);

  // Cohort teams in this industry sorted by quarter score descending
  const cohortTeams = state.teams
    .filter((t) => t.industryId === team.industryId)
    .map((t) => {
      const qd = t.quarterlyData.find((q) => q.quarter === qData.quarter);
      return {
        id: t.id,
        name: t.name,
        isCurrent: t.id === team.id,

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function formatChatMessage(rawText) {
  if (!rawText) return '';

  // 1. Sanitize raw HTML tags to prevent XSS
  const sanitized = escapeHtml(rawText);

  // 2. Parse lines
  const rawLines = sanitized.split('\n');
  const blocks = [];
  let currentList = [];

  const flushList = () => {
    if (currentList.length > 0) {
      blocks.push(`<ul class="chat-bubble-list">${currentList.map((li) => `<li>${li}</li>`).join('')}</ul>`);
      currentList = [];
    }
  };

  for (let i = 0; i < rawLines.length; i++) {
    let line = rawLines[i].trim();

    // Check for bullet point (•, -, *)
    if (line.startsWith('•') || line.startsWith('- ') || line.startsWith('* ')) {
      let content = line.replace(/^[•\-\*]\s*/, '');
      content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      content = content.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
      currentList.push(content);
      continue;
    }

    // Numbered list item (e.g., "1. ")
    if (/^\d+\.\s+/.test(line)) {
      let content = line.replace(/^\d+\.\s+/, '');
      content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      content = content.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
      currentList.push(content);
      continue;
    }

    // Not a list item: flush any pending list
    flushList();

    if (line === '') {
      blocks.push('<div class="chat-spacer"></div>');
      continue;
    }

    // Horizontal divider rules (***, ---, ___)
    if (line === '***' || line === '---' || line === '___') {
      blocks.push('<div class="chat-divider-rule"></div>');
      continue;
    }

    // Markdown heading syntax (#, ##, ###, ####)
    if (/^#{1,4}\s+/.test(line)) {
      line = line.replace(/^#{1,4}\s+/, '');
      let formattedHeading = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      formattedHeading = formattedHeading.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
      blocks.push(`<div class="chat-section-label">${formattedHeading}</div>`);
      continue;
    }

    // Format bold and italics inside regular lines
    let formattedLine = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    formattedLine = formattedLine.replace(/\*([^\*]+)\*/g, '<em>$1</em>');

    // Hero Header detection (Welcome banners & Market Briefing headers)
    if (line.startsWith('🚀 **Welcome') || line.startsWith('🚀 **Startup Venture Registered') || line.startsWith('📊 **Market Intelligence Briefing')) {
      blocks.push(`<div class="chat-heading-hero">${formattedLine}</div>`);
      continue;
    }

    // Parameter box detection (Industry & Geographic Scope parameters)
    if (line.startsWith('🏢 **Assigned Industry:') || line.startsWith('📍 **Geographic Scope:')) {
      blocks.push(`<div class="chat-param-row">${formattedLine}</div>`);
      continue;
    }

    // Section prompt callout headers
    if (
      line.startsWith('💡 **') ||
      line.startsWith('📌 **') ||
      line.startsWith('🔍 **') ||
      line.startsWith('🎯 **') ||
      line.startsWith('🏢 **Industry') ||
      line.startsWith('⚔️ **') ||
      line.startsWith('👥 **') ||
      line.startsWith('💰 **') ||
      line.startsWith('📋 **')
    ) {
      blocks.push(`<div class="chat-section-label">${formattedLine}</div>`);
      continue;
    }

    blocks.push(`<p class="chat-p">${formattedLine}</p>`);
  }

  flushList();

  return blocks.join('');
}
function initStudentChatEvents() {
  const scrollContainer = document.getElementById('chat-messages-scrollable');

  // Auto scroll to bottom
  if (scrollContainer) {
    scrollContainer.scrollTop = scrollContainer.scrollHeight;
  }

  // Back to overview
  const backOverview = document.getElementById('btn-chat-back-overview');
  if (backOverview) {
    backOverview.addEventListener('click', () => {
      store.setView('student-landing');
    });
  }

  // Advance to next quarter buttons (Header and Dossier buttons)
  const advanceButtons = document.querySelectorAll('.btn-advance-quarter');
  advanceButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      store.advanceToNextQuarter();
    });
  });

  // Quarter Navigation Ribbon Quick-Jump Pills
  const ribbonPills = document.querySelectorAll('.quarter-nav-pill[data-jump-quarter]');
  ribbonPills.forEach((pill) => {
    pill.addEventListener('click', () => {
      const q = pill.getAttribute('data-jump-quarter');
      const targetSection = document.getElementById(`quarter-section-${q}`);
      if (targetSection) {
        targetSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  // Chat message send handler with Gemini backend integration
  const textarea = document.getElementById('chat-textarea-input');
  const sendBtn = document.getElementById('btn-chat-send');

  const handleSend = async () => {
    if (!textarea) return;
    const text = textarea.value.trim();
    if (!text) return;

    textarea.value = '';
    textarea.style.height = 'auto';

    // Auto scroll immediately
    if (scrollContainer) {
      setTimeout(() => {
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
      }, 30);
    }

    // Call store async Gemini handler
    await store.sendStudentChatMessage(text);

    // Auto scroll after AI reply
    if (scrollContainer) {
      setTimeout(() => {
        scrollContainer.scrollTop = scrollContainer.scrollHeight;
      }, 50);
    }
  };

  sendBtn?.addEventListener('click', handleSend);

  // Multiline Enter & Shift+Enter handler
  if (textarea) {
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Auto-grow textarea height
    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
    });
  }
}

function initProfessorDashboardEvents() {
  // Sort Buttons
  document.querySelectorAll('[data-sort-by]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const field = e.currentTarget.getAttribute('data-sort-by');
      if (currentSortField === field) {
        currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
      } else {
        currentSortField = field;
        currentSortDir = 'desc';
      }
      store.notify();
    });
  });

  // Toggle Settings
  const toggleSettingsBtn = document.getElementById('btn-toggle-scoring-settings');
  if (toggleSettingsBtn) {
    toggleSettingsBtn.addEventListener('click', () => {
      isSettingsExpanded = !isSettingsExpanded;
      store.notify();
    });
  }

  // Weight Inputs Live Validation
  const form = document.getElementById('form-scoring-weights');
  if (form) {
    const inputs = form.querySelectorAll('.weight-input');
    const updateSum = () => {
      let sum = 0;
      inputs.forEach(inp => {
        sum += Number(inp.value) || 0;
      });
      const validMsg = document.getElementById('weights-validation-msg');
      if (validMsg) {
        if (Math.round(sum) === 100) {
          validMsg.style.color = '#059669';
          validMsg.innerText = '✓ Valid configuration: Weights sum to exactly 100%.';
        } else {
          validMsg.style.color = '#dc2626';
          validMsg.innerText = `⚠ Weights sum to ${Math.round(sum)}%. Must adjust to exactly 100% to save.`;
        }
      }
    };
    inputs.forEach(inp => inp.addEventListener('input', updateSum));
  }

  // Save Weights Button
  const saveWeightsBtn = document.getElementById('btn-save-weights');
  if (saveWeightsBtn) {
    saveWeightsBtn.addEventListener('click', () => {
      const form = document.getElementById('form-scoring-weights');
      if (!form) return;
      const formData = new FormData(form);
      const newWeights = {};
      formData.forEach((val, key) => {
        newWeights[key] = Number(val);
      });

      const res = store.updateScoringWeights(newWeights);
      if (res.success) {
        isSettingsExpanded = false;
        store.notify();
      }
    });
  }

  // Reset Weights Button
  const resetWeightsBtn = document.getElementById('btn-reset-weights');
  if (resetWeightsBtn) {
    resetWeightsBtn.addEventListener('click', () => {
      const defaultWeights = {
        strategicDecisionQuality: 20,
        reasoningAndEvidence: 15,
        marketAdaptability: 20,
        financialManagement: 15,
        competitivePerformance: 10,
        riskAssessment: 10,
        learningFromDecisions: 10
      };
      store.updateScoringWeights(defaultWeights);
      store.notify();
    });
  }

  // Industry Select change
  document.querySelectorAll('[data-industry-select]').forEach((select) => {
    select.addEventListener('change', (e) => {
      const teamId = e.target.getAttribute('data-industry-select');
      const newIndustryId = e.target.value;
      store.assignTeamIndustry(teamId, newIndustryId);
    });
  });

  // View Report buttons
  document.querySelectorAll('[data-view-report]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const teamId = e.currentTarget.getAttribute('data-view-report');
      store.setView('professor-report', { teamId });
    });
  });

  // Row clicks open report
  document.querySelectorAll('[data-team-row]').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.tagName.toLowerCase() === 'select' || e.target.tagName.toLowerCase() === 'button') {
        return;
      }
      const teamId = row.getAttribute('data-team-row');
      store.setView('professor-report', { teamId });
    });
  });
}

                                <div><strong>Profit / Loss:</strong> ${qData.financialIndicators.profitLoss}</div>
                                <div><strong>Cash Balance:</strong> ${qData.financialIndicators.cashBalance}</div>
                                ${qData.financialIndicators.debtBalance && qData.financialIndicators.debtBalance !== 'None' ? `<div><strong>Debt Balance:</strong> ${qData.financialIndicators.debtBalance}</div>` : ''}
                              </div>
                            `
                                : '<div style="color: var(--color-text-muted);">Financials: Awaiting evaluation</div>'
                            }
                          </div>
                        </div>

                        <div class="q-box">
                          <div class="q-box-title">Quarterly Score & Cumulative Standing</div>
                          <div class="q-box-content">
                            <span style="font-size: 1.4rem; font-weight: 800; color: var(--color-primary-navy);">
                              ${qData.score} / 100
                            </span>
                            <div style="font-size: 0.78rem; color: var(--color-text-muted); margin-top: 4px;">
                              ${qData.evaluationFeedback?.scoreExplanation || 'Graded on strategic coherence, unit economics, and risk management.'}
                            </div>
                          </div>
                        </div>

                        <div class="q-box">
                          <div class="q-box-title">Key Strengths Identified</div>
                          <div class="q-box-content" style="color: #047857; font-weight: 500;">
                            ${qData.whatWentWell || 'Awaiting evaluation'}
                          </div>
                        </div>

                        <div class="q-box">
                          <div class="q-box-title">Mistakes & Weaknesses</div>
                          <div class="q-box-content" style="color: #b91c1c; font-weight: 500;">
                            ${qData.mistakesWeaknesses || 'Awaiting evaluation'}
                          </div>
                        </div>

                        <!-- 7 Evaluation Criteria Breakdown Table -->
                        ${Array.isArray(qData.criterionBreakdown) && qData.criterionBreakdown.length > 0 ? `
                        <div class="q-box" style="grid-column: 1 / -1; padding: 12px;">
                          <div class="q-box-title" style="margin-bottom: 6px;">7-Criterion Academic Evaluation Dossier</div>
                          <div class="table-responsive">
                            <table class="academic-table" style="font-size: 0.8rem;">
                              <thead>
                                <tr>
                                  <th>Criterion</th>
                                  <th style="text-align: center; width: 14%;">Weight</th>
                                  <th style="text-align: center; width: 14%;">Score</th>
                                  <th style="text-align: right; width: 14%;">Contribution</th>
                                </tr>
                              </thead>
                              <tbody>
                                ${qData.criterionBreakdown.map(item => `
                                  <tr>
                                    <td>
                                      <strong style="color: var(--color-primary-navy);">${item.label}</strong>
                                      <div style="font-size: 0.72rem; color: var(--color-text-muted);">${item.explanation}</div>
                                    </td>
                                    <td style="text-align: center;">${item.weight}%</td>
                                    <td style="text-align: center; font-weight: 700; color: var(--color-primary-navy);">${item.score}/100</td>
                                    <td style="text-align: right; font-weight: 800; color: var(--color-primary-navy);">${item.contribution}</td>
                                  </tr>
                                `).join('')}
                              </tbody>
                            </table>
                          </div>
                        </div>
                        ` : ''}

                        <div class="q-box" style="grid-column: 1 / -1;">
                          <div class="q-box-title">Competitor Moves & Market Changes</div>
                          <div class="q-box-content">
                            ${qData.marketResponseEvaluation || 'Awaiting evaluation'}
                          </div>
                        </div>
                      </div>
                    `
                    }
                  </div>
                `
                }
              </div>
            </div>
          `;
          })
          .join('')}
      </div>
    </div>
  `;
}
function initProfessorReportEvents() {
  // Back to Dashboard
  const backBtn = document.getElementById('btn-back-to-dashboard');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      store.setView('professor-dashboard', { teamId: null });
    });
  }

  // Accordion Toggles
  document.querySelectorAll('[data-toggle-quarter]').forEach((header) => {
    header.addEventListener('click', () => {
      const parent = header.closest('.accordion-item');
      if (parent) {
        parent.classList.toggle('open');
      }
    });
  });

  // Expand All / Collapse All
  const expandAllBtn = document.getElementById('btn-expand-all');
  if (expandAllBtn) {
    expandAllBtn.addEventListener('click', () => {
      document.querySelectorAll('.accordion-item').forEach((item) => item.classList.add('open'));
    });
  }

  const collapseAllBtn = document.getElementById('btn-collapse-all');
  if (collapseAllBtn) {
    collapseAllBtn.addEventListener('click', () => {
      document.querySelectorAll('.accordion-item').forEach((item) => item.classList.remove('open'));
    });
  }

  // Grade Quarter with Gemini
  document.querySelectorAll('[data-grade-quarter]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const quarterNum = parseInt(btn.getAttribute('data-grade-quarter'), 10);
      const teamId = btn.getAttribute('data-team-id');

      btn.disabled = true;
      btn.innerText = 'Evaluating with Gemini...';
      await store.executeQuarterSimulation(teamId, quarterNum);
    });
  });
}

/**
 * Academic Business Strategy Simulation Platform
 * Main Application Orchestrator & Screen Router
 */






class SimulationApp {
  constructor() {
    this.root = document.getElementById('app-root');
    this.init();
  }

  init() {
    // Initial render
    this.render();

    // Subscribe to central state changes
    store.subscribe(() => {
      this.render();
    });
  }

  render() {
    const state = store.getState();

    let viewHtml = '';
    let initEvents = () => {};

    switch (state.activeView) {
      case 'student-landing':
        viewHtml = renderStudentLanding();
        initEvents = initStudentLandingEvents;
        break;
      case 'student-chat':
        viewHtml = renderStudentChat();
        initEvents = initStudentChatEvents;
        break;
      case 'professor-dashboard':
        viewHtml = renderProfessorDashboard();
        initEvents = initProfessorDashboardEvents;
        break;
      case 'professor-report':
        viewHtml = renderProfessorReport();
        initEvents = initProfessorReportEvents;
        break;
      default:
        viewHtml = renderStudentLanding();
        initEvents = initStudentLandingEvents;
    }

    const toastHtml = state.notification
      ? `
      <div class="app-toast" role="status" aria-live="polite">
        <span style="font-size: 1.1rem;">ℹ️</span>
        <span>${state.notification}</span>
      </div>
    `
      : '';

    this.root.innerHTML = `
      ${renderHeader()}
      <main class="main-container">
        ${viewHtml}
      </main>
      ${toastHtml}
    `;

    // Attach event listeners for header and active view
    initHeaderEvents();
    initEvents();
  }
}

// Bootstrap on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  window.simApp = new SimulationApp();
});
